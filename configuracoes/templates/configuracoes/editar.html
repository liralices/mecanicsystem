{% extends "base.html" %}
{% block titulo %}Editar Configurações - MecanicSystem{% endblock %}

{% block conteudo %}

<div class="form-card">
  <h2 style="font-size: 24px; font-weight: 600; color: #1a3c5e; margin-bottom: 24px;">Personalizar Oficina</h2>
  
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    
    <div class="row">
      <div class="col-md-6">
        <div style="margin-bottom: 24px;">
          <label class="form-label">Logo da Oficina</label>
          <div style="border: 2px dashed #5ba4cf; border-radius: 8px; padding: 24px; text-align: center; background: #f8fbff;">
            {% if config.logo %}
              <div style="margin-bottom: 12px;">
                <img src="{{ config.logo.url }}" alt="Logo" style="max-height: 120px; max-width: 200px;">
              </div>
            {% else %}
              <div style="font-size: 32px; margin-bottom: 8px;">📸</div>
              <p style="color: #666; margin: 0;">Nenhuma logo adicionada</p>
            {% endif %}
            <input type="file" name="logo" accept="image/*" style="margin-top: 12px; width: 100%;" onchange="previewImage(this)">
            <p style="font-size: 12px; color: #888; margin-top: 8px;">Formatos: JPG, PNG, GIF</p>
          </div>
        </div>
      </div>
      
      <div class="col-md-6">
        <div style="margin-bottom: 20px;">
          <label class="form-label">Nome da Oficina</label>
          <input type="text" name="nome_oficina" class="form-control" value="{{ config.nome_oficina }}" required>
        </div>
        
        <div style="margin-bottom: 20px;">
          <label class="form-label">Telefone</label>
          <input type="tel" name="telefone" class="form-control" value="{{ config.telefone }}">
        </div>
        
        <div style="margin-bottom: 20px;">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" value="{{ config.email }}">
        </div>
        
        <div style="margin-bottom: 20px;">
          <label class="form-label">Endereço</label>
          <textarea name="endereco" class="form-control" rows="3">{{ config.endereco }}</textarea>
        </div>
      </div>
    </div>
    
    <div style="margin-top: 24px; display: flex; gap: 12px;">
      <button type="submit" class="btn-salvar">💾 Salvar Configurações</button>
      <a href="/" class="btn-cancelar">Cancelar</a>
    </div>
  </form>
</div>

<script>
  function previewImage(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        // Aqui você poderia atualizar a visualização em tempo real
      }
      reader.readAsDataURL(input.files[0]);
    }
  }
</script>

{% endblock %}
