{% extends "base.html" %}
{% block titulo %}Nova Peça - MecaSystem{% endblock %}
{% block nav_estoque %}active{% endblock %}

{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <div class="page-title">Nova Peça</div>
    <div class="page-sub">Cadastre uma peça no estoque</div>
  </div>
  <a href="/estoque/" class="btn-cancelar">← Voltar</a>
</div>

<div class="form-card" style="max-width:600px">
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Nome da peça *</label>
      <input type="text" name="nome" class="form-control" placeholder="Ex: Filtro de óleo" required>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Quantidade em estoque</label>
        <input type="number" name="quantidade" class="form-control" value="0" min="0">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Fornecedor</label>
        <input type="text" name="fornecedor" class="form-control" placeholder="Ex: Distribuidora ABC">
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Preço de custo (R$) *</label>
        <input type="text" name="preco_custo" class="form-control" placeholder="Ex: 25,00" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Preço de venda (R$) *</label>
        <input type="text" name="preco_venda" class="form-control" placeholder="Ex: 45,00" required>
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn-salvar">Salvar Peça</button>
      <a href="/estoque/" class="btn-cancelar">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
