{% extends "base.html" %}
{% load core_filters %}
{% block titulo %}Editar OS - MecanicSystem{% endblock %}
{% block nav_ordens %}active{% endblock %}

{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <div class="page-title">Editar OS #{{ ordem.id }}</div>
    <div class="page-sub">Atualize os dados da ordem de serviço</div>
  </div>
  <a href="/ordens/" class="btn-cancelar">← Voltar</a>
</div>
<div class="form-card" style="max-width:600px">
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Cliente *</label>
      <select name="cliente" id="clienteSelect" class="form-control" required onchange="atualizarVeiculos()">
        {% for cliente in clientes %}
          <option value="{{ cliente.id }}" {% if cliente.id == ordem.cliente.id %}selected{% endif %}>{{ cliente.nome }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Veículo</label>
      <select name="veiculo" id="veiculoSelect" class="form-control">
        <option value="">Selecione um veículo...</option>
        {% for veiculo in veiculos %}
          <option value="{{ veiculo.id }}" data-cliente="{{ veiculo.cliente.id }}" {% if veiculo.id == ordem.veiculo.id %}selected{% endif %}>{{ veiculo.marca }} {{ veiculo.modelo }} - {{ veiculo.placa }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Descrição do serviço *</label>
      <textarea name="descricao" class="form-control" rows="3" required>{{ ordem.descricao }}</textarea>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Mão de obra (R$)</label>
        <input type="text" name="mao_de_obra" class="form-control" value="{{ ordem.mao_de_obra|br_format }}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-control">
          <option value="aberta" {% if ordem.status == 'aberta' %}selected{% endif %}>Aberta</option>
          <option value="em_andamento" {% if ordem.status == 'em_andamento' %}selected{% endif %}>Em andamento</option>
          <option value="aguardando_peca" {% if ordem.status == 'aguardando_peca' %}selected{% endif %}>Aguardando peça</option>
          <option value="concluida" {% if ordem.status == 'concluida' %}selected{% endif %}>Concluída</option>
        </select>
      </div>
    </div>
    <div class="mb-3">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="concluida" id="concluida" {% if ordem.concluida %}checked{% endif %}>
        <label class="form-check-label" for="concluida">
          Ordem de serviço concluída
        </label>
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn-salvar">Salvar alterações</button>
      <a href="/ordens/" class="btn-cancelar">Cancelar</a>
    </div>
  </form>
</div>

<script>
function atualizarVeiculos() {
    const clienteSelect = document.getElementById('clienteSelect');
    const veiculoSelect = document.getElementById('veiculoSelect');
    const clienteId = clienteSelect.value;
    
    // Limpar seleção de veículo
    veiculoSelect.value = '';
    
    // Mostrar/ocultar opções de veículos baseado no cliente selecionado
    Array.from(veiculoSelect.options).forEach(option => {
        if (option.value === '') {
            option.style.display = '';
        } else {
            option.style.display = option.dataset.cliente === clienteId ? '' : 'none';
        }
    });
}

// Executar ao carregar a página para filtrar os veículos do cliente selecionado
document.addEventListener('DOMContentLoaded', function() {
    atualizarVeiculos();
});
</script>
{% endblock %}
