{% extends "base.html" %}
{% block titulo %}Novo Veículo - MecaSystem{% endblock %}
{% block nav_clientes %}active{% endblock %}

{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <div class="page-title">Novo Veículo</div>
    <div class="page-sub">Cadastre um veículo para {{ cliente.nome }}</div>
  </div>
  <a href="/clientes/detalhe/{{ cliente.id }}/" class="btn-cancelar">← Voltar</a>
</div>

<div class="form-card" style="max-width:600px">
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Placa *</label>
      <input type="text" name="placa" class="form-control" placeholder="ABC-1234" required maxlength="10">
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Marca *</label>
        <input type="text" name="marca" class="form-control" placeholder="Ex: Toyota" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Modelo *</label>
        <input type="text" name="modelo" class="form-control" placeholder="Ex: Corolla" required>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Ano *</label>
        <input type="number" name="ano" class="form-control" placeholder="2020" required min="1900" max="2099">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Cor</label>
        <input type="text" name="cor" class="form-control" placeholder="Ex: Branco">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Quilometragem atual</label>
      <input type="number" name="quilometragem" class="form-control" placeholder="0" value="0" min="0">
    </div>
    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn-salvar">Salvar Veículo</button>
      <a href="/clientes/detalhe/{{ cliente.id }}/" class="btn-cancelar">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
