<p style="color:#888;font-size:14px;margin-top:4px">Sistema de gestão para oficinas mecânicas</p>
</div>

<div class="row g-3 justify-content-center">
  <div class="col-md-4">
    <a href="/clientes/" style="text-decoration:none">

        <div style="font-size:32px;margin-bottom:10px">👥</div>
        <div style="font-size:16px;font-weight:600;color:#1a3c5e">Clientes</div>
        <div style="font-size:12px;color:#888;margin-top:4px">Cadastrar e consultar clientes</div>
      </div>
    </a>
  </div>
  <div class="col-md-4">
    <a href="/estoque/" style="text-decoration:none">
      <div class="stat-card text-center" style="cursor:pointer;transition:box-shadow 0.2s" onmouseover="this.style.boxShadow='0 4px 16px rgba(26,111,196,0.15)'" onmouseout="this.style.boxShadow='none'">

        <div style="font-size:16px;font-weight:600;color:#1a3c5e">Estoque</div>
        <div style="font-size:12px;color:#888;margin-top:4px">Controle de peças e materiais</div>
      </div>
    </a>
  </div>
  <div class="col-md-4">
    <a href="/ordens/" style="text-decoration:none">
      <div class="stat-card text-center" style="cursor:pointer;transition:box-shadow 0.2s" onmouseover="this.style.boxShadow='0 4px 16px rgba(26,111,196,0.15)'" onmouseout="this.style.boxShadow='none'">

        <div style="font-size:16px;font-weight:600;color:#1a3c5e">Ordens de Serviço</div>
        <div style="font-size:12px;color:#888;margin-top:4px">Abrir e gerenciar OS</div>
      </div>
    </a>
  </div>
</div>
{% endblock %}
