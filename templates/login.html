{% extends "base.html" %}

{% block titulo %}Login - MecanicSystem{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="form-card">
      <h2 style="font-size: 24px; margin-bottom: 20px; color: #1a3c5e;">Entrar no sistema</h2>

      {% if form.errors %}
      <div style="background: #fdecea; color: #611a15; border: 1px solid #f5c2c7; border-radius: 8px; padding: 12px; margin-bottom: 16px;">
        Usuário ou senha inválidos. Verifique e tente novamente.
      </div>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_username" class="form-label">Usuário</label>
          <input type="text" name="username" autofocus required id="id_username" class="form-control">
        </div>
        <div class="mb-3">
          <label for="id_password" class="form-label">Senha</label>
          <input type="password" name="password" required id="id_password" class="form-control">
        </div>
        <button type="submit" class="btn-salvar w-100">Entrar</button>
      </form>

      <p style="font-size: 13px; color: #666; margin-top: 16px; text-align: center;">
        Não tem usuário? <a href="{% url 'registrar' %}">Criar conta</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
